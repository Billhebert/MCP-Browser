name: BVP Browser CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6 AM

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          BROWSER_HEADLESS=true npx tsx src/index.ts &
          sleep 5
          echo "Server started"

      - name: Run SEO audit
        run: |
          curl -s -X POST http://localhost:3100/api/tools/analyze_seo/execute \
            -H "Content-Type: application/json" \
            -d '{"args":{}}' | jq .

      - name: Run security scan
        run: |
          curl -s -X POST http://localhost:3100/api/tools/check_security/execute \
            -H "Content-Type: application/json" \
            -d '{"args":{}}' | jq .

      - name: Run tests
        run: npm test

  lighthouse-schedule:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Run Lighthouse audit
        run: |
          BROWSER_HEADLESS=true npx tsx -e "
            const { chromium } = require('playwright');
            (async () => {
              const browser = await chromium.launch({ headless: true });
              const page = await browser.newPage();
              await page.goto('https://YOUR-SITE.com');
              const metrics = await page.evaluate(() => ({
                lcp: performance.getEntriesByType('paint').find(p => p.name === 'first-contentful-paint')?.startTime || 0,
                resources: performance.getEntriesByType('resource').length,
              }));
              console.log(JSON.stringify(metrics));
              await browser.close();
            })();
          "
